# DOCUMENTATION: https://docs.artillex-studios.com/axtrade.html
# ITEM BUILDER: https://docs.artillex-studios.com/item-builder.html
# Diseño inspirado en Minijuegos.yml

# ----- AJUSTES -----

title: '&0Trade ▸ %player%'
rows: 6

# ----- SLOTS DE INTERCAMBIO -----

own-slots:
- 9-12
- 18-21
- 27-30
- 36-39
- 45-48

partner-slots:
- 14-17
- 23-26
- 32-35
- 41-44
- 50-53

# ----- TU LADO -----

own:
  confirm-item:
    slot: 0
    accept:
      material: LIME_CONCRETE
      name: '&fTrade ▸ &aConfirmar &f(&e✔&f)'
      lore:
      - '&8Información'
      - '&f'
      - ' &fConfirma que tu oferta'
      - ' &fes correcta antes de'
      - ' &frealizar el intercambio.'
      - '&f'
      - ' &7▲ ¡ Click para confirmar!'
    cancel:
      material: RED_CONCRETE
      name: '&fTrade ▸ &cCancelar confirmación'
      lore:
      - '&8Información'
      - '&f'
      - ' &fTu oferta ya está confirmada.'
      - ' &fPuedes cancelar si deseas'
      - ' &fmodificar algún objeto.'
      - '&f'
      - ' &7▲ ¡ Click para cancelar!'

  currency1:
    slot: 2
    currency: Vault
    material: GOLD_INGOT
    name: '&fOferta ▸ &aDinero &f(&e✔&f)'
    lore:
    - '&8Información'
    - '&f'
    - ' &fCantidad ofrecida:'
    - ' &a$%amount%'
    - '&f'
    - ' &7▲ ¡ Click para cambiar!'

  currency2:
    slot: 3
    currency: Experience
    material: EXPERIENCE_BOTTLE
    name: '&fOferta ▸ &aExperiencia &f(&e✔&f)'
    lore:
    - '&8Información'
    - '&f'
    - ' &fExperiencia ofrecida:'
    - ' &a%amount% EXP'
    - '&f'
    - ' &7▲ ¡ Click para cambiar!'

# ----- LADO DEL OTRO JUGADOR -----

partner:
  confirm-item:
    slot: 8
    accept:
      material: RED_CONCRETE
      name: '&fEstado ▸ &cEsperando...'
      lore:
      - '&8Información'
      - '&f'
      - ' &f%partner-name% aún no ha'
      - ' &fconfirmado el intercambio.'
      - '&f'
      - ' &7▲ Esperando al jugador...'
    cancel:
      material: LIME_CONCRETE
      name: '&fEstado ▸ &aConfirmado &f(&e✔&f)'
      lore:
      - '&8Información'
      - '&f'
      - ' &a%partner-name% &fya confirmó'
      - ' &fel intercambio.'
      - '&f'
      - ' &7▲ ¡ Oferta confirmada!'

  currency1:
    slot: 6
    currency: Vault
    material: GOLD_INGOT
    name: '&fOferta ▸ &aDinero de %partner-name%'
    lore:
    - '&8Información'
    - '&f'
    - ' &fCantidad ofrecida:'
    - ' &a$%amount%'
    - '&f'
    - ' &7▲ Oferta de %partner-name%'

  currency2:
    slot: 5
    currency: Experience
    material: EXPERIENCE_BOTTLE
    name: '&fOferta ▸ &aEXP de %partner-name%'
    lore:
    - '&8Información'
    - '&f'
    - ' &fExperiencia ofrecida:'
    - ' &a%amount% EXP'
    - '&f'
    - ' &7▲ Oferta de %partner-name%'

# ----- DECORACIÓN -----

decoracion-central:
  slot:
  - 4
  - 13
  - 22
  - 31
  - 40
  - 49
  material: GRAY_STAINED_GLASS_PANE
  name: ' '

decoracion-superior:
  slot:
  - 1
  - 7
  material: GRAY_STAINED_GLASS_PANE
  name: ' '

# do not change this
version: 1
